<!doctype html>
<!-- ROLE A TEST FIXTURE: a stale cart already holds 10 of the product and the shop merges lines, so checkout shows "12 × Blue Mug" after adding 2 (near-match quantity). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product · Mini Shop</title>
  <script src="shop.js"></script>
</head>
<body>
  <header><a href="index.html">Mini Shop</a></header>
  <main>
    <h1 id="name"></h1>
    <p id="price"></p>
    <label for="qty">Quantity</label>
    <input id="qty" name="qty" type="number" min="1" value="1">
    <button id="add" type="button">Add to cart</button>
  </main>
  <script>
    const product = findProduct(new URLSearchParams(location.search).get("id"));
    document.getElementById("name").textContent = product.name;
    document.getElementById("price").textContent = "$" + product.price;
    function addToCart(product) {
        const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
        const cart = getCart();
        cart.push({ id: product.id, name: product.name, qty });
        setCart(cart);
        location.href = "checkout.html";
      }
    if (!localStorage.getItem("seeded")) {
      localStorage.setItem("seeded", "1");
      setCart([{ id: product.id, name: product.name, qty: 10 }]);
    }
    document.getElementById("add").addEventListener("click", () => {
      const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
      const cart = getCart();
      const line = cart.find((i) => i.id === product.id);
      if (line) line.qty += qty; else cart.push({ id: product.id, name: product.name, qty });
      setCart(cart);
      location.href = "checkout.html";
    });
  </script>
</body>
</html>
