<html lang="en"><head>
  <meta charset="utf-8">
  <title>Blue Mug · Mini Shop</title>
  <script src="shop.js"></script>
</head>
<body>
  <header><a href="index.html">Mini Shop</a></header>
  <main>
    <h1 id="name">Blue Mug</h1>
    <p id="price">$12</p>
    <label for="qty">Quantity</label>
    <input id="qty" name="qty" type="number" min="1" value="1">
    <button id="add" type="button">Add to cart</button>
  </main>
  <script>
    const product = findProduct(new URLSearchParams(location.search).get("id"));
    if (!product) {
      document.querySelector("main").innerHTML = "<p>Product not found</p>";
    } else {
      document.title = `${product.name} · Mini Shop`;
      document.getElementById("name").textContent = product.name;
      document.getElementById("price").textContent = `$${product.price}`;
      document.getElementById("add").addEventListener("click", () => {
        const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
        const cart = getCart();
        cart.push({ id: product.id, name: product.name, qty });
        setCart(cart);
        location.href = "checkout.html";
      });
    }
  </script>
